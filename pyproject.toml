[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genda"
version = "0.1.0"
description = "GenDA genomic masked diffusion training and inference"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "numpy", "pandas", "PyYAML", "pyfaidx", "scikit-learn", "tqdm"]

[project.optional-dependencies]
tracking = ["wandb"]
clinvar = ["pyarrow"]

[project.scripts]
genda-train = "genda.training.cli:main"
genda-predict = "genda.inference.cli:main"

[tool.setuptools.packages.find]
include = ["genda*"]
